<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1626">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<title>Nicolas Sattin Coaching</title>
<style>
:root{--navy:#0e1626;--navy-2:#1b2842;--amber:#f0a500;--ink:#1a1f2b;--muted:#5b6576;--ghost:#98a2b3;--rule:#dde4ec;--field:#f6f8fb;--paper:#ffffff;--heading:#0e1626;--bad:#b42318;--ok:#1f7a4d;--warn:#a86b00;--warn-bg:#fff3d1;--bad-bg:#fdecea;--info-bg:#e9eef8;--blue:#2f6fed;--violet:#7e57c2;
--bg:var(--field);--card:var(--paper);--text:var(--ink);--line:var(--rule);
--display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eef1f6;--muted:#a3adbf;--ghost:#6f7b92;--rule:#2a3856;--field:#0a101c;--paper:#141d30;--heading:#ffffff;--bad:#ff8a80;--ok:#5ed39b;--warn:#f0a500;--warn-bg:#3a2f10;--bad-bg:#3b1a1c;--info-bg:#1b2842;--blue:#6ea0ff;--violet:#b39ddb}}
:root[data-theme="dark"]{--ink:#eef1f6;--muted:#a3adbf;--ghost:#6f7b92;--rule:#2a3856;--field:#0a101c;--paper:#141d30;--heading:#ffffff;--bad:#ff8a80;--ok:#5ed39b;--warn:#f0a500;--warn-bg:#3a2f10;--bad-bg:#3b1a1c;--info-bg:#1b2842;--blue:#6ea0ff;--violet:#b39ddb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.0625rem/1.45 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:40px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:.7rem 1rem}
.brand{font:700 1.45rem/1 var(--display);letter-spacing:.01em}.brand span{color:var(--amber)}
.sync{font:500 .78rem var(--body);color:#9fb0cc;white-space:nowrap}
main{max-width:40rem;margin:0 auto;padding:16px}
h1{font:700 2.3rem/1.02 var(--display);color:var(--heading);margin:8px 0 4px}
h2{font:600 .78rem/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:24px 0 10px}
.sub{color:var(--muted);font-size:.92rem}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
button{font:600 1rem var(--body);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;background:var(--card);color:var(--text)}
button.primary{background:var(--amber);border-color:var(--amber);color:var(--navy)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.alert{border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:.98rem;border-left:4px solid var(--ghost)}
.alert.warn{background:var(--warn-bg);border-left-color:var(--amber)}.alert.bad{background:var(--bad-bg);border-left-color:var(--bad)}.alert.info{background:var(--info-bg);border-left-color:var(--navy-2)}
.alert b{display:block;font:700 1.1rem/1.2 var(--display);letter-spacing:.01em;color:var(--heading);margin-bottom:2px}
.st{padding:12px 0;border-top:1px solid var(--line)}.st:first-child{border-top:0;padding-top:0}.st:last-child{padding-bottom:0}
.name{font:700 1.3rem/1.1 var(--display);letter-spacing:.01em;color:var(--heading)}
.num{font:700 1.6rem/1 var(--display);text-align:right}.num small{font:500 .8rem var(--body);color:var(--muted)}
.bar2{height:8px;border-radius:99px;background:var(--rule);margin-top:8px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--amber);border-radius:99px}
.bar2.over i{background:var(--bad)}
.tag{font:600 .75rem var(--body);padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}.tag.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}.kv:first-of-type{border-top:0}
.kv b{font:700 1.15rem var(--display)}
.ev{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.ev:first-of-type{border-top:0}
.ev .t{width:46px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem}
.cdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ghost)}.cdot.red{background:var(--bad)}.cdot.blue{background:var(--blue)}.cdot.violet{background:var(--violet)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header class="bar"><span class="brand">Nicolas Sattin <span>Coaching</span></span><span id="sync" class="sync"></span></header>
<main id="app"></main>
<script>
const CAL='Google Calendar';
let mcp=null,db=null,roster=null,events=[],state='idle',err=null,updatedAt=null,loading=false;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymdT=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

function parseEv(ev){
  const raw=String(ev.summary||'');
  const m=raw.match(/\s*[-–]\s*(\d+)\s*$/);
  const base=raw.replace(/\s*[-–]\s*\d+\s*$/,'').replace(/\?/g,'').trim();
  const nb=norm(base);
  return{num:m?+m[1]:null,nb,first:nb.split(' ')[0]||'',start:ev.start?.dateTime?new Date(ev.start.dateTime):null,end:ev.end?.dateTime?new Date(ev.end.dateTime):null,color:ev.colorId||'',ev};
}

function compute(){
  const now=new Date(),base=new Date(roster.baseline);
  const evs=events.filter(e=>e.status!=='cancelled').map(parseEv).filter(e=>e.start&&e.end);
  const past=evs.filter(e=>e.end<now).sort((a,b)=>a.start-b.start);
  const students=(roster.students||[]).map(s=>{
    const key=norm(s.name),ex=s.excludeColors||[];
    const mine=past.filter(e=>e.start>=base&&e.first===key&&!ex.includes(e.color));
    let done=s.done+mine.length,note='';
    let last=-1;mine.forEach((e,i)=>{if(e.num!=null)last=i});
    if(last>=0){const viaNum=mine[last].num+(mine.length-1-last);if(viaNum!==done)note=`écart : numéros de l'agenda ${viaNum}, calcul ${done}`;done=viaNum}
    return{name:s.name,pack:s.pack,done,rest:s.pack-done,note};
  }).sort((a,b)=>a.rest-b.rest);
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const wk=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));
  const count=(f,from)=>past.filter(e=>e.start>=from&&f(e)).length;
  const trainme=e=>e.nb.startsWith('cours collectif')||e.nb.startsWith('paris atelier');
  const mma=e=>e.nb==='mma factory';
  const billing=[];
  (roster.monthly||[]).forEach(n=>billing.push({label:n,sub:'facturé en fin de mois',month:count(e=>e.first===norm(n),monthStart)}));
  billing.push({label:'Trainme',sub:'cours collectifs et ateliers',week:count(trainme,wk),month:count(trainme,monthStart)});
  billing.push({label:'MMA Factory',sub:'mercredi',week:count(mma,wk),month:count(mma,monthStart)});
  return{students,billing};
}

function todayList(){
  const t=new Date(),d0=new Date(t.getFullYear(),t.getMonth(),t.getDate()),d1=new Date(d0.getTime()+864e5);
  return events.filter(e=>e.status!=='cancelled').map(parseEv).filter(e=>e.start&&e.start>=d0&&e.start<d1).sort((a,b)=>a.start-b.start);
}

function render(){
  const el=document.getElementById('app');
  let h='<h1>Élèves</h1>';
  if(!mcp||!db){return el.innerHTML=h+'<div class="alert info"><b>Ouvre cette page dans Claude</b>Le suivi lit ton agenda Google, il ne fonctionne que dans Claude.</div>'}
  if(!roster){return el.innerHTML=h+'<div class="alert info"><b>Liste des élèves vide</b>Demande à Claude de l\'initialiser.</div>'}
  if(state==='err'){
    const m={needs_reauth:'Reconnecte Google Agenda dans Réglages › Connecteurs.',server_not_connected:'Ajoute Google Agenda dans Réglages › Connecteurs.',not_in_manifest:'Accès à Google Agenda refusé pour cette page.',consent_required:'Accès à Google Agenda refusé pour cette page.'}[err]||'Impossible de lire l\'agenda pour le moment.';
    return el.innerHTML=h+`<div class="alert bad"><b>Agenda indisponible</b>${esc(m)}</div><button class="primary" id="reload">Réessayer</button>`;
  }
  if(state!=='ok'){return el.innerHTML=h+'<div class="sub">Lecture de ton agenda…</div>'}
  const {students,billing}=compute();
  const bs=new Date(roster.baseline);
  h+=`<div class="row"><div class="sub grow">Calculé depuis ton agenda${updatedAt?' à '+pad(updatedAt.getHours())+'h'+pad(updatedAt.getMinutes()):''}</div><button id="reload" ${loading?'disabled':''}>↻ Actualiser</button></div>`;
  const al=students.filter(s=>s.rest<=1);
  if(al.length){h+='<h2>À traiter</h2>'+al.map(s=>s.rest<=0
    ?`<div class="alert bad"><b>${esc(s.name)} : pack terminé</b>${s.done} séances sur ${s.pack}${s.rest<0?` (${-s.rest} au-delà)`:''} · à facturer et à renouveler.</div>`
    :`<div class="alert warn"><b>${esc(s.name)} : plus qu'une séance</b>${s.done} sur ${s.pack} · pense à la facture et au renouvellement.</div>`).join('')}
  h+='<h2>Où en sont tes élèves</h2><div class="card">'+students.map(s=>{
    const pct=Math.min(100,Math.max(0,Math.round(s.done/s.pack*100)));
    const tag=s.rest<=0?'<span class="tag bad">terminé</span>':s.rest===1?'<span class="tag warn">plus qu\'une</span>':'';
    return `<div class="st"><div class="row"><div class="grow"><div class="name">${esc(s.name)}</div><div class="sub">${s.done} / ${s.pack} séances ${tag}</div></div><div class="num">${Math.max(0,s.rest)}<br><small>restante${s.rest>1?'s':''}</small></div></div><div class="bar2 ${s.rest<0?'over':''}"><i style="width:${pct}%"></i></div>${s.note?`<div class="sub" style="color:var(--warn)">${esc(s.note)}</div>`:''}</div>`}).join('')+'</div>';
  h+='<h2>Pour ta facturation</h2><div class="card">'+billing.map(b=>`<div class="kv"><span>${esc(b.label)}<div class="sub">${esc(b.sub)}</div></span><span style="text-align:right">${b.week!=null?`<b>${b.week}</b> <span class="sub">cette semaine</span><br>`:''}<b>${b.month}</b> <span class="sub">en ${MOIS[new Date().getMonth()]}</span></span></div>`).join('')+'</div>';
  const td=todayList();
  h+='<h2>Aujourd\'hui</h2><div class="card">'+(td.length?td.map(e=>{
    const c=e.color==='11'?'red':(e.color==='7'||e.color==='9')?'blue':e.color==='3'?'violet':'';
    const hh=e.start?pad(e.start.getHours())+':'+pad(e.start.getMinutes()):'';
    return `<div class="ev"><span class="t">${hh}</span><span class="cdot ${c}"></span><div class="grow ell">${esc(e.ev.summary||'(sans titre)')}</div></div>`}).join(''):'<div class="sub">Rien dans ton agenda aujourd\'hui.</div>')+'</div>';
  h+=`<div class="sub" style="margin-top:14px">Points de départ des comptes : ${bs.getDate()} ${MOIS[bs.getMonth()]} ${bs.getFullYear()}. Pour un nouvel élève ou un renouvellement, dis-le à Claude.</div>`;
  el.innerHTML=h;
}

async function load(){
  if(!mcp||!roster||loading)return;
  loading=true;if(state!=='ok')state='loading';render();
  const now=new Date(),base=new Date(roster.baseline);
  const from=new Date(Math.min(base.getTime(),new Date(now.getFullYear(),now.getMonth(),1).getTime()));
  const to=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  try{
    let all=[],token;
    for(let i=0;i<4;i++){
      const inp={startTime:ymdT(from),endTime:ymdT(to),orderBy:'startTime',pageSize:250};
      if(token)inp.pageToken=token;
      const r=await mcp.callTool(CAL,'list_events',inp,{cache:false});
      let pl=r.payload;if(typeof pl==='string'){try{pl=JSON.parse(pl)}catch{pl=null}}
      all=all.concat(pl?.events||[]);token=pl?.nextPageToken;if(!token)break;
    }
    events=all;state='ok';err=null;updatedAt=new Date();
  }catch(e){state='err';err=e?.code||'upstream_error'}
  loading=false;render();
}

document.addEventListener('click',e=>{if(e.target.closest('#reload'))load()});
function setSync(t){const el=document.getElementById('sync');if(el)el.textContent=t||''}
render();
(async()=>{
  try{
    const c=window.claude;if(!(c&&c.use))return;
    const [m,d]=await Promise.all([c.use('mcp').catch(()=>null),c.use('db').catch(()=>null)]);
    mcp=m;db=d;render();
    if(!db)return;
    db.doc('roster/main').onSnapshot(sn=>{roster=sn.exists?sn.data():null;setSync(roster?'☁ liste à jour':'');if(roster)load();else render()},()=>setSync('⚠ liste indisponible'));
  }catch(e){}
})();
</script>
</body>
</html>
